services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pg-embeddings
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: embeddings
    ports:
      - "5432:5432"
    volumes:
      - pg_embeddings_data:/var/lib/postgresql/data

volumes:
  pg_embeddings_data:
